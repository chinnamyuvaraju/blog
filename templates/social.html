{% extends "base.html" %}
{% block content %}
<section class="link-profile" style="background:{{ links.background }};color:{{ links.foreground }}">
  {% if links.image %}<img class="link-avatar" src="{{ url('assets/uploads/' + links.image) }}" alt="{{ links.title }}">{% else %}<div class="link-avatar initials" aria-hidden="true">YC</div>{% endif %}
  <h1>{{ links.title }}</h1>
  <p>{{ links.bio }}</p>
  <div class="link-buttons">
    <a href="{{ url('archive/') }}" style="background:{{ links.button }}">Read my posts <span aria-hidden="true">↗</span></a>
    {% for link in links.links %}
    <a href="{{ link.url }}" style="background:{{ links.button }}">{{ link.label }} <span aria-hidden="true">↗</span></a>
    {% endfor %}
  </div>
</section>
{% endblock %}
